<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#17372e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Saldo" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/saldo-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/saldo-apple-touch.png" />
    <link rel="preconnect" href="https://clerk.bdpserver.online" crossorigin />
    <style>
      #boot-auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #boot-copy {
        padding: 70px 12%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #193f33;
        color: #f5f7ed;
      }
      #boot-copy strong {
        margin-bottom: 100px;
        font-size: 33px;
      }
      #boot-copy h1 {
        margin: 0;
        font-size: clamp(36px, 4vw, 60px);
        line-height: 1.2;
      }
      #boot-copy p {
        max-width: 350px;
        margin: 30px 0 0;
        color: #b0c5b4;
        font-size: 16px;
        line-height: 1.9;
      }
      #boot-copy small {
        margin-top: 60px;
        color: #8eab94;
      }
      #boot-form {
        background: #f5f6f3;
      }
      @media (max-width: 900px) {
        #boot-auth {
          grid-template-columns: 1fr;
        }
        #boot-copy {
          padding: 45px;
        }
        #boot-copy strong {
          margin-bottom: 40px;
        }
        #boot-copy h1 {
          font-size: 36px;
        }
        #boot-copy small {
          margin-top: 20px;
        }
      }
    </style>
    <title>Saldo | Finanças pessoais</title>
  </head>
  <body>
    <div id="root">
      <main id="boot-auth">
        <section id="boot-copy">
          <strong>saldo.</strong>
          <h1>Mais clareza.<br />Melhores decisões.</h1>
          <p>Suas contas, seus objetivos e seu futuro financeiro, em um só lugar.</p>
          <small>Receitas e despesas reais. Planejamento separado.</small>
        </section>
        <section id="boot-form" aria-hidden="true"></section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
