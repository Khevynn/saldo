services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?Defina uma senha aleatoria URL-safe no arquivo .env}

  migrate:
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${DOCKER_POSTGRES_PASSWORD:?Defina DOCKER_POSTGRES_PASSWORD no arquivo .env}@db:5432/finance
      APP_DB_PASSWORD: ${DOCKER_APP_DB_PASSWORD:?Defina DOCKER_APP_DB_PASSWORD no arquivo .env}

  api:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance_app:${DOCKER_APP_DB_PASSWORD:?Defina DOCKER_APP_DB_PASSWORD no arquivo .env}@db:5432/finance
      WEB_ORIGIN: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL com a origem HTTPS sem barra final},https://localhost,https://mobile.saldo.bdpserver.online
      CLERK_AUTHORIZED_PARTIES: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL com a origem HTTPS sem barra final},https://localhost,https://mobile.saldo.bdpserver.online
      MOBILE_UPDATE_BASE_URL: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL com a origem HTTPS sem barra final}
      ALLOW_PLAINTEXT_DATABASE_ON_PRIVATE_DOCKER_NETWORK: "true"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN no arquivo .env}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
